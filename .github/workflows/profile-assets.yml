name: Profile assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0b3d91&color_dots=#ebedf0,#fecaca,#f87171,#ef4444,#b91c1c
            dist/github-contribution-grid-snake-dark.svg?color_snake=#3b82f6&color_dots=#161b22,#fecaca,#f87171,#ef4444,#b91c1c

      # Platane/snk is a Docker action and runs as root, so the dist/ it
      # creates is root-owned and the next step cannot write into it.
      - name: Take ownership of the build directory
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-stats.mjs

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
